name: Send Gold Prices to Bale

on:
  schedule:
    # گیت‌هاب هر یک ساعت این فرآیند را زنده نگه می‌دارد
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Execute script in continuous loop
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          # اجرای حلقه به مدت ۵۰ دقیقه و ارسال پیام در فواصل بسیار کوتاه (هر ۶۰ ثانیه)
          for i in {1..50}
          do
            echo "ارسال نوبت $i..."
            node bot.js
            sleep 60
          done
